<style>
:root {
  --bg: #0A0A0C; --panel: #0F0F12; --panel-2: #151519; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
  --text: #F2F2F3; --muted: #8B8B93; --dim: #5C5C64; --soft: #C6C6CC;
  --accent: #B9A3F5; --accent-ink: #120D20;
  --ok: #3DDC84; --warn: #E8C37F; --err: #FF5F6D;
  --sans: "Mona Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 22px 28px 48px; }
header { display: flex; align-items: center; gap: 14px; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -0.03em; }
.brand img { width: 32px; height: 32px; display: block; }
.ver { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line-2); padding: 2px 7px; border-radius: 6px; }
.spacer { flex: 1; }
.ws { font: 12px var(--mono); color: var(--dim); max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 550; padding: 4px 11px 4px 9px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--muted); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.pill.crawling i, .pill.indexing i { background: var(--accent); box-shadow: 0 0 0 3px rgba(185,163,245,.16); animation: pulse 1.2s infinite; }
.pill.done i { background: var(--ok); } .pill.error i { background: var(--err); } .pill.stopped i { background: var(--warn); }
.pill.crawling, .pill.indexing { color: var(--text); }
@keyframes pulse { 50% { opacity: .35; } }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.card h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.card h2 .note { text-transform: none; letter-spacing: 0; font-weight: 450; color: var(--dim); font-size: 12.5px; margin-left: auto; }
label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
input[type=text], input[type=number], select {
  width: 100%; background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 11px; outline: none;
}
input:focus, select:focus { border-color: rgba(185,163,245,.55); box-shadow: 0 0 0 3px rgba(185,163,245,.14); }
input::placeholder { color: var(--dim); }
.row { display: grid; gap: 12px; }
.row.cols { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; }
.actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.check { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
.check input { accent-color: #B9A3F5; width: 15px; height: 15px; }
.btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: rgba(255,255,255,.24); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #C9B8F8; border-color: #C9B8F8; }
.btn:disabled { opacity: .45; cursor: default; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stat { background: var(--panel); padding: 12px 14px; }
.stat b { display: block; font: 600 21px/1.25 var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat.key b { color: var(--accent); }
.stat span { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin: 16px 0 10px; border: 1px solid var(--line); }
.bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.event { font: 12px/1.5 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event em { font-style: normal; color: var(--text); }
.ask { margin-top: 18px; }
.askrow { display: flex; gap: 10px; }
.askrow input { flex: 1; }
.askrow select { width: 82px; }
.answer { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); position: relative; }
.answer::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 2px; border-radius: 2px; background: var(--accent); }
.answer .k { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.answer p { margin: 0; white-space: pre-wrap; }
.passages { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.passages li { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--panel); }
.p-head { display: flex; gap: 10px; align-items: baseline; }
.p-n { font: 12px var(--mono); color: var(--dim); }
.p-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-path { color: var(--muted); font-weight: 450; }
.p-score { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
.p-url { font: 12px var(--mono); color: var(--dim); text-decoration: none; display: block; margin: 2px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-url:hover { color: var(--muted); }
.p-text { color: var(--soft); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.empty { color: var(--dim); font-size: 13px; padding: 10px 0 2px; }
.pages { margin-top: 18px; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { text-align: left; font-size: 12px; font-weight: 550; color: var(--muted); padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--panel-2); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; width: 92px; }
td.n { font: 12.5px var(--mono); }
td.i, th.i { width: 48px; color: var(--dim); font: 12px var(--mono); }
td.u { font: 12.5px var(--mono); color: var(--muted); }
.drawer { position: fixed; inset: 0 0 0 auto; width: min(620px, 100%); background: var(--panel); border-left: 1px solid var(--line-2); transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; z-index: 10; }
.drawer.open { transform: none; }
.drawer header { padding: 18px 20px; margin: 0; }
.drawer pre { margin: 0; padding: 18px 20px 40px; overflow: auto; font: 12.5px/1.6 var(--mono); color: var(--soft); white-space: pre-wrap; flex: 1; }
.err { color: var(--err); font-size: 13px; margin-top: 10px; min-height: 1px; }
@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .wrap { padding: 16px; }
  .ws { display: none; }
  .row.cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  th.hide, td.hide { display: none; }
}
</style>
</head>

        <div class="row cols">
          <div><label class="f" for="max">Max pages</label><input type="number" id="max" value="50" min="1"></div>
          <div><label class="f" for="depth">Depth</label><input type="number" id="depth" value="3" min="0"></div>
          <div><label class="f" for="delay">Delay (ms)</label><input type="number" id="delay" value="500" min="0"></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="start" type="submit">Start crawl</button>
          <button class="btn" id="stop" type="button" disabled>Stop</button>
          <span class="spacer"></span>
          <label class="check"><input type="checkbox" id="sitemap" checked> Seed from sitemap</label>
        </div>
        <div class="err" id="crawlErr"></div>
      </form>
    </section>

    <section class="card">
      <h2>Progress <span class="note" id="elapsed"></span></h2>
      <div class="stats">
        <div class="stat key"><b id="sPages">0</b><span>pages saved</span></div>
        <div class="stat"><b id="sWords">0</b><span>words</span></div>
        <div class="stat"><b id="sTokens">0</b><span>est. tokens</span></div>
        <div class="stat"><b id="sQueue">0</b><span>in queue</span></div>
        <div class="stat"><b id="sSkip">0</b><span>skipped</span></div>
        <div class="stat"><b id="sErr">0</b><span>errors</span></div>
      </div>
      <div class="bar"><div id="bar"></div></div>
      <div class="event" id="event">No crawl yet.</div>
    </section>
  </div>

  <section class="card ask">
    <h2>Ask <span class="note" id="indexNote">No index loaded</span></h2>
    <form class="askrow" id="ask">
      <input type="text" id="q" placeholder="Ask the dataset a question" autocomplete="off">
      <select id="k" aria-label="Passages"><option value="3">k 3</option><option value="5" selected>k 5</option><option value="10">k 10</option></select>
      <button class="btn primary" type="submit" id="askBtn">Ask</button>
    </form>
    <div class="actions" style="margin-top:10px"><label class="check" id="llmWrap"><input type="checkbox" id="llm" disabled> <span id="llmLabel">Cited answer with a hosted model (set ANTHROPIC_API_KEY or OPENAI_API_KEY)</span></label></div>
    <div class="err" id="askErr"></div>
    <div id="result"></div>
  </section>

  <section class="card pages">
    <h2>Pages <span class="note" id="pageNote"></span></h2>
    <table>
      <thead><tr><th class="i">#</th><th>Title</th><th class="hide">URL</th><th class="n">Words</th><th class="n hide">Tokens</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="noPages">Pages appear here as they are saved.</div>
  </section>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <header><div class="p-title" id="dTitle"></div><span class="spacer"></span><button class="btn" id="dClose" type="button">Close</button></header>
  <pre id="dText"></pre>
</aside>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n || 0).toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pathOf = (u) => { try { const x = new URL(u); return x.pathname + x.search; } catch { return u; } };
let timer = null;
let lastCount = -1;

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function render(s) {
  const c = s.crawl;
  const st = c.stats || {};
  const running = c.status === 'crawling' || c.status === 'indexing';
  $('ver').textContent = 'v' + s.version;
  $('ws').textContent = s.dir;
  $('ws').title = s.dir;
  const pill = $('pill');
  pill.className = 'pill ' + c.status;
  pill.lastElementChild.textContent = c.status;
  $('start').disabled = running;
  $('stop').disabled = c.status !== 'crawling';
  const pages = c.stats ? st.pages : s.totals.pages;
  $('sPages').textContent = fmt(pages);
  $('sWords').textContent = fmt(c.stats ? st.words : s.totals.words);
  $('sTokens').textContent = fmt(c.stats ? st.tokens : s.totals.tokens_est);
  $('sQueue').textContent = fmt(c.queue);
  $('sSkip').textContent = fmt((st.robotsSkipped || 0) + (st.nonHtml || 0) + (st.duplicates || 0) + (st.noindex || 0) + (st.canonicalized || 0) + (st.known || 0));
  $('sErr').textContent = fmt(st.errors);
  const pct = c.status === 'done' || c.status === 'indexing' ? 100 : c.maxPages ? Math.min(100, (100 * (st.pages || 0)) / c.maxPages) : 0;
  $('bar').style.width = pct + '%';
  if (c.startedAt) {
    const end = c.finishedAt ? Date.parse(c.finishedAt) : Date.now();
    $('elapsed').textContent = ((end - Date.parse(c.startedAt)) / 1000).toFixed(1) + 's';
  }
  if (c.status === 'error') $('event').innerHTML = '<em>error</em> ' + esc(c.error);
  else if (c.status === 'done' || c.status === 'stopped') $('event').innerHTML = `<em>${c.status}</em> ${fmt(st.pages)} pages from ${esc(c.url)}` + (s.index ? `, indexed ${fmt(s.index.docs)} chunks` : '');
  else if (c.status === 'indexing') $('event').innerHTML = '<em>indexing</em> chunking and building the BM25 index';
  else if (c.last) $('event').innerHTML = `<em>${esc(c.last.type)}</em> ${esc(c.last.url)}`;
  else if (s.totals.pages) $('event').innerHTML = `<em>loaded</em> ${fmt(s.totals.pages)} pages from ${esc(s.files.dataset)}`;

  $('indexNote').textContent = s.index ? `${fmt(s.index.docs)} chunks, ${fmt(s.index.terms)} terms` : 'No index loaded';
  $('llm').disabled = !s.llm;
  $('llmLabel').textContent = s.llm ? `Cited answer with ${s.llm === 'anthropic' ? 'Anthropic' : 'OpenAI'}` : 'Cited answer with a hosted model (set ANTHROPIC_API_KEY or OPENAI_API_KEY)';

  if (s.pages.length !== lastCount) {
    lastCount = s.pages.length;
    $('rows').innerHTML = s.pages.map((p, i) => `<tr data-url="${esc(p.url)}"><td class="i">${i + 1}</td><td>${esc(p.title || '(untitled)')}</td><td class="u hide">${esc(pathOf(p.url))}</td><td class="n">${fmt(p.words)}</td><td class="n hide">${fmt(p.tokens_est)}</td></tr>`).join('');
    $('noPages').style.display = s.pages.length ? 'none' : '';
    $('pageNote').textContent = s.pages.length ? `${fmt(s.pages.length)} shown, avg ${fmt(s.totals.avg_words)} words` : '';
  }
  return running;
}

async function poll() {
  clearTimeout(timer);
  try {
    const running = render(await api('/api/state'));
    timer = setTimeout(poll, running ? 700 : 4000);
  } catch {
    timer = setTimeout(poll, 4000);
  }
}

$('crawl').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('crawlErr').textContent = '';
  try {
    await api('/api/crawl', { url: $('url').value, maxPages: $('max').value, depth: $('depth').value, delay: $('delay').value, sitemap: $('sitemap').checked });
    lastCount = -1;
    poll();
  } catch (err) { $('crawlErr').textContent = err.message; }
});
$('stop').addEventListener('click', async () => { try { await api('/api/stop', {}); } catch {} poll(); });

$('ask').addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = $('q').value.trim();
  if (!question) return;
  $('askErr').textContent = '';
  $('askBtn').disabled = true;
  try {
    const r = await api('/api/ask', { question, k: Number($('k').value), llm: $('llm').checked });
    const answer = r.llm ? r.llm.text : r.answer;
    const label = r.llm ? `Answer from ${esc(r.llm.model)}` : 'Extractive answer';
    $('result').innerHTML = (r.passages.length
      ? `<div class="answer"><div class="k">${label}</div><p>${esc(answer || 'No sentence in the top passages matches the question well.')}</p></div>`
      : '<div class="empty">No passage matches those terms.</div>') +
      `<ol class="passages">${r.passages.map((p, i) => `<li><div class="p-head"><span class="p-n">[${i + 1}]</span><span class="p-title">${esc(p.title)}${p.heading_path.length ? ` <span class="p-path">&rsaquo; ${esc(p.heading_path.join(' › '))}</span>` : ''}</span><span class="p-score">${p.score.toFixed(2)}</span></div><a class="p-url" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a><div class="p-text">${esc(p.text.replace(/^#{1,6} .*\n+/, '').replace(/\n{2,}/g, '\n'))}</div></li>`).join('')}</ol>`;
  } catch (err) { $('askErr').textContent = err.message; }
  $('askBtn').disabled = false;
});

$('rows').addEventListener('click', async (e) => {
  const tr = e.target.closest('tr');
  if (!tr) return;
  try {
    const rec = await api('/api/page?url=' + encodeURIComponent(tr.dataset.url));
    $('dTitle').textContent = rec.title || rec.url;
    $('dText').textContent = rec.url + '\n\n' + rec.text;
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
  } catch {}
});
$('dClose').addEventListener('click', () => { $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('dClose').click(); });
poll();
</script>
</body>
</html>
